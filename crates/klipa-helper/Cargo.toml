[package]
name = "klipa-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Privileged root helper for klipa: toggles macOS system sleep on request (lid-closed keep-awake)."
repository.workspace = true
authors.workspace = true

[[bin]]
name = "klipa-helper"
path = "src/main.rs"

# Runs as root, so the dependency set is kept deliberately tiny and
# auditable: the shared wire protocol, serde for the structured messages
# and the root-owned recovery journal, and nothing else. All privileged
# work (pmset, the caller code-signature check) is hand-written FFI in this
# crate, not a third-party dependency.
[dependencies]
klipa-ipc = { path = "../klipa-ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
